---
layout: orbit
---
<a class="text-link" href="{{ '/#research' | relative_url }}">↖ Explore all research</a>
<article class="document-article">
  <p class="eyebrow">RESEARCH NOTE / <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time></p>
  <h1>{{ page.title | escape }}</h1>
  <p class="document-byline">By <a href="{{ '/#about' | relative_url }}">Inhoe Koo</a></p>
  {% if page.image and page.hide_header_image != true %}<img class="research-image" src="{{ '/images/' | append: page.image | relative_url }}" alt="{{ page.title | escape }}">{% endif %}
  <div class="document-content">{{ content }}</div>
</article>
